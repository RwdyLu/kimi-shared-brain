<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Trading Monitor</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#0a0e17; color:#e0e0e0; padding:16px; }
.card { background:#151a25; border-radius:12px; padding:16px; margin-bottom:16px; border:1px solid #1e2530; }
.card-title { font-size:14px; color:#8b9bb4; margin-bottom:12px; text-transform:uppercase; letter-spacing:1px; }
.row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #1e2530; }
.row:last-child { border-bottom:none; }
.symbol { font-weight:600; color:#fff; }
.price { font-family:monospace; font-size:16px; color:#00d4aa; }
.price.down { color:#ff4757; }
.change { font-size:12px; padding:2px 6px; border-radius:4px; }
.change.up { background:rgba(0,212,170,0.15); color:#00d4aa; }
.change.down { background:rgba(255,71,87,0.15); color:#ff4757; }
.status { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
.status.green { background:#00d4aa; box-shadow:0 0 6px rgba(0,212,170,0.5); }
.status.red { background:#ff4757; }
.status.yellow { background:#ffa502; }
.badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#2d3748; }
.badge.enabled { background:rgba(0,212,170,0.2); color:#00d4aa; }
.badge.disabled { background:rgba(255,71,87,0.2); color:#ff4757; }
.positive { color:#00d4aa; }
.negative { color:#ff4757; }
.pnl { font-family:monospace; font-size:14px; }
.loading { text-align:center; padding:40px; color:#8b9bb4; }
.error { text-align:center; padding:40px; color:#ff4757; }
.timestamp { font-size:11px; color:#5a6b7f; text-align:center; margin-top:16px; }
.header { text-align:center; margin-bottom:20px; }
.header h1 { font-size:20px; color:#fff; }
.header p { font-size:12px; color:#5a6b7f; margin-top:4px; }
.balance { font-size:28px; font-weight:700; color:#00d4aa; text-align:center; margin:8px 0; }
</style>
</head>
<body>
<div class="header">
<h1>📊 Trading Monitor</h1>
<p id="status-line">正在连接...</p>
</div>

<div id="content">
<div class="loading">⏳ 加载中...</div>
</div>
<div class="timestamp" id="timestamp"></div>

<script>
const API_BASE = window.location.origin;

async function loadData() {
    try {
        const [prices, strategies, paper] = await Promise.all([
            fetch('/api/prices').then(r => r.json()).catch(() => null),
            fetch('/api/strategies').then(r => r.json()).catch(() => null),
            fetch('/api/paper').then(r => r.json()).catch(() => null)
        ]);
        render(prices, strategies, paper);
    } catch(e) {
        document.getElementById('content').innerHTML = `<div class="error">❌ 连接失败: ${e.message}</div>`;
    }
}

function render(prices, strategies, paper) {
    let html = '';
    
    // Paper Balance Summary
    if (paper) {
        const balance = paper.current_balance || 0;
        const pnl = paper.total_pnl || 0;
        const pnlPct = paper.pnl_pct || 0;
        const positions = paper.open_positions || 0;
        html += `
        <div class="card">
            <div class="card-title">💰 模拟账户</div>
            <div class="balance">$${balance.toLocaleString('en-US',{maximumFractionDigits:2})}</div>
            <div class="row">
                <span>总盈亏</span>
                <span class="pnl ${pnl >= 0 ? 'positive' : 'negative'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)} (${pnlPct >= 0 ? '+' : ''}${pnlPct.toFixed(2)}%)</span>
            </div>
            <div class="row">
                <span>持仓数量</span>
                <span>${positions}</span>
            </div>
        </div>`;
    }
    
    // Prices
    if (prices && prices.length > 0) {
        html += `<div class="card"><div class="card-title">📈 最新价格</div>`;
        prices.forEach(p => {
            const chg = p.change_24h || 0;
            html += `
            <div class="row">
                <div>
                    <span class="symbol">${p.symbol}</span>
                    <span class="change ${chg >= 0 ? 'up' : 'down'}">${chg >= 0 ? '+' : ''}${chg.toFixed(2)}%</span>
                </div>
                <span class="price ${chg < 0 ? 'down' : ''}">$${p.price.toLocaleString('en-US',{maximumFractionDigits:p.price < 1 ? 4 : 2})}</span>
            </div>`;
        });
        html += '</div>';
    }
    
    // Strategies
    if (strategies) {
        const enabled = strategies.filter ? strategies.filter(s => s.enabled) : [];
        const disabled = strategies.filter ? strategies.filter(s => !s.enabled) : [];
        html += `
        <div class="card">
            <div class="card-title">🤖 策略状态</div>
            <div class="row">
                <span>已启用</span>
                <span class="badge enabled">${enabled.length}</span>
            </div>
            <div class="row">
                <span>已禁用</span>
                <span class="badge disabled">${disabled.length}</span>
            </div>
        </div>`;
        
        if (enabled.length > 0) {
            html += `<div class="card"><div class="card-title">✅ 启用策略</div>`;
            enabled.forEach(s => {
                const pnl = s.pnl || 0;
                html += `
                <div class="row">
                    <span>${s.id}</span>
                    <span class="pnl ${pnl >= 0 ? 'positive' : 'negative'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</span>
                </div>`;
            });
            html += '</div>';
        }
    }
    
    // Open Positions
    if (paper && paper.positions && paper.positions.length > 0) {
        html += `<div class="card"><div class="card-title">🎯 当前持仓</div>`;
        paper.positions.forEach(pos => {
            const pnl = pos.unrealized_pnl || 0;
            html += `
            <div class="row">
                <div>
                    <span class="symbol">${pos.symbol}</span>
                    <span class="badge">${pos.strategy}</span>
                </div>
                <span class="pnl ${pnl >= 0 ? 'positive' : 'negative'}">${pnl >= 0 ? '+' : ''}$${pnl.toFixed(2)}</span>
            </div>`;
        });
        html += '</div>';
    }
    
    document.getElementById('content').innerHTML = html;
    document.getElementById('status-line').textContent = '✅ 实时连接';
    document.getElementById('timestamp').textContent = '更新: ' + new Date().toLocaleString('zh-CN');
}

// Load immediately and refresh every 30 seconds
loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
